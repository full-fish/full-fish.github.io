---
layout: nil
permalink: /admin/
---

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Category Admin</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #fffaf1;
        --ink: #222222;
        --muted: #6b655d;
        --line: #d8cdbd;
        --accent: #004d40;
        --danger: #b71c1c;
        --ok: #1b5e20;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 10%, #efe6d8 0%, var(--bg) 50%, #e8dfd1 100%);
        min-height: 100vh;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 18px 50px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      h2 { margin: 0 0 12px; font-size: 20px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
      input[type="text"], input[type="password"], textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
      }
      textarea { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
      }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
      button.good { background: var(--ok); color: #fff; border-color: var(--ok); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .hidden { display: none; }
      .small { font-size: 12px; color: var(--muted); }
      .status { font-weight: 600; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--danger); }

      .tree { list-style: none; margin: 0; padding-left: 0; }
      .node {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 8px;
        margin-top: 8px;
      }
      .node-head {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 8px;
        align-items: center;
      }
      .node-tools { display: flex; gap: 6px; flex-wrap: wrap; }
      .node-children { list-style: none; margin: 8px 0 0; padding-left: 18px; }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>카테고리 관리자</h1>
        <div class="small">
          GitHub API로 _data/category_tree.yml을 직접 수정합니다. 마스터 계정
          토큰으로만 저장됩니다.
        </div>
      </div>

      <section id="auth" class="card">
        <h2>1) 관리자 인증</h2>
        <div class="row">
          <div style="flex:2; min-width:280px;">
            <label>GitHub Personal Access Token (repo contents write)</label>
            <input id="token" type="password" placeholder="ghp_..." />
          </div>
          <div style="min-width:220px;">
            <label>Branch</label>
            <input id="branch" type="text" placeholder="main" />
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button id="btn-auth" class="primary">인증</button>
          <span id="auth-status" class="status"></span>
        </div>
        <div class="small" style="margin-top:8px;">
          보안 메모: 정적 사이트 특성상 URL 자체를 숨길 수는 없습니다. 실제 쓰기
          권한은 마스터 토큰 검증으로 제한됩니다.
        </div>
      </section>

      <section id="panel" class="card hidden">
        <h2>2) 카테고리 트리 편집</h2>
        <div class="row" style="margin-bottom:10px;">
          <button id="btn-reload">원격 다시 불러오기</button>
          <button id="btn-add-root">루트 카테고리 추가</button>
          <button id="btn-export">JSON 내보내기</button>
        </div>
        <div id="tree-root"></div>
        <div class="row" style="margin-top:12px;">
          <div style="flex:1; min-width:320px;">
            <label>Commit message</label>
            <input
              id="commit-msg"
              type="text"
              value="chore: update category tree from admin"
            />
          </div>
        </div>
        <div class="row" style="margin-top:8px;">
          <button id="btn-save" class="good">GitHub에 저장</button>
          <span id="save-status" class="status"></span>
        </div>
        <div class="card" style="margin-top:12px;">
          <h2 style="font-size:16px;">미리보기 (YAML)</h2>
          <textarea id="yaml-preview" readonly></textarea>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="/admin/main.js"></script>
  </body>
</html>
