# 사이트 설정. 바꾼 뒤에는 `jekyll serve`를 다시 시작해야 반영됩니다.
# 테마는 Minimal Mistakes 4.24 를 저장소에 그대로 들고 있습니다 (_layouts, _includes, _sass/minimal-mistakes).
# 사이트 전용 코드는 _sass/fullfish, _plugins, _data 에 있습니다.

minimal_mistakes_skin: "default"

# Site
locale: "ko-KR"
title: "Fullfish Apps"
title_separator: "-"
subtitle: "일상을 더 가볍게 만드는 앱을 만듭니다"
name: "fullfish"
description: "fullfish가 만든 앱과 개발 블로그"
url: "https://full-fish.github.io"
baseurl: ""
repository: "full-fish/full-fish.github.io"
logo: "/assets/images/logo.svg"
masthead_title: "fullfish"
date_format: "%Y.%m.%d"
timezone: Asia/Seoul
search: false

author:
  name: "fullfish"
  bio: "앱을 만들고, 배운 것을 기록합니다"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/full-fish"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/full-fish"

# Reading files
include:
  - _pages
  - app-ads.txt
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .serena
  - .venv
  - .env
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - TODO.md
  - CHANGELOG.md
  - "*.gemspec"
  - package.json
  - package-lock.json
  - banner.js
  - Rakefile
  - staticman.yml
  - screenshot*.png
  - Pocketlog_img.png
  - docs
  - test
  - scripts
  - fullfish-1-1 # 티스토리 원본 백업 (로컬 전용)
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
keep_files:
  - .git
encoding: "utf-8"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  # 글에 명령어·코드가 많아 --, ..., 따옴표를 바꾸지 않고 그대로 둡니다 (복사해서 바로 쓸 수 있게)
  smart_quotes: apos,apos,quot,quot
  typographic_symbols: { ndash: "--", mdash: "---", hellip: "..." }

sass:
  sass_dir: _sass
  style: compressed

# Outputting
# 카테고리를 URL에서 뺐습니다(이름을 바꿔도 글 주소가 안 바뀌게).
# 예전 주소(/:categories/:title/)는 _plugins/taxonomy_pages.rb 가 리다이렉트 페이지로 남깁니다.
permalink: /blog/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# 카테고리/태그 페이지는 _plugins/taxonomy_pages.rb 가 만듭니다.
# type 을 jekyll-archives 로 두면 테마가 /categories/<이름>/ 형태로 링크합니다.
category_archive:
  type: jekyll-archives
  path: /categories/
tag_archive:
  type: jekyll-archives
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      read_time: false
      share: false
      related: true
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: false
      toc_label: "목차"
      toc_icon: "list"
