{% if page.previous or page.next %}
<nav class="post-nav" aria-label="이전 글과 다음 글">
  {% if page.previous %}
  <a class="post-nav__link" href="{{ page.previous.url | relative_url }}" rel="prev">
    <span class="post-nav__label">← 이전 글</span>
    <span class="post-nav__title">{{ page.previous.title | escape }}</span>
  </a>
  {% else %}<span></span>{% endif %}
  {% if page.next %}
  <a class="post-nav__link post-nav__link--next" href="{{ page.next.url | relative_url }}" rel="next">
    <span class="post-nav__label">다음 글 →</span>
    <span class="post-nav__title">{{ page.next.title | escape }}</span>
  </a>
  {% endif %}
</nav>
{% endif %}
