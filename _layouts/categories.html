---
layout: archive
---

{{ content }}

<div class="category-index">
  {% include category-tree-nav.html nodes=site.data.category_nav %}
</div>

<script>
  // 예전 링크(/categories/#카테고리)로 들어오면 해당 카테고리 페이지로 보냅니다.
  (function () {
    var urls = {{ site.data.category_hash_redirects | jsonify }};
    var slug = "";
    try { slug = decodeURIComponent(location.hash.slice(1)).toLowerCase(); } catch (e) {}
    if (urls[slug]) location.replace("{{ site.baseurl }}" + urls[slug]);
  })();
</script>
