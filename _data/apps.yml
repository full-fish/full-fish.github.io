    카드·은행·페이 알림과 문자를 읽어 지출을 바로 기록하고, 알림이 없는 결제는
    주문내역 스크린샷 한 장으로 채우는 가계부입니다. 회원가입 없이 데이터는 휴대폰 안에만 저장됩니다.
  icon: /assets/images/apps/pocketlog/icon.png
  privacy_url: /privacy/pocketlog/
  terms_url: /terms/pocketlog/
  features:
    - "카드 · 은행 · 페이 알림과 문자로 자동 기록"
    - "스크린샷 · 영수증 AI 분석 (동의한 경우에만)"
    - "예산, 월간 리포트, 홈 화면 위젯"
    - "내 Google 드라이브에 암호화 백업"
